<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Substituído pelo valor de `--base-href` no `flutter build`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TaskFlow: gestão de tarefas, projetos e produtividade da equipe.">
  <meta name="theme-color" content="#3D33D6">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TaskFlow">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TaskFlow</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #F4F4FA; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font-family: "Segoe UI", Roboto, Arial, sans-serif; color: #5E6075;
    }
    #loading img { width: 72px; height: 72px; }
    #loading .bar {
      width: 160px; height: 4px; border-radius: 2px; overflow: hidden;
      background: #E8E7FB;
    }
    #loading .bar::after {
      content: ""; display: block; width: 40%; height: 100%;
      background: #3D33D6; border-radius: 2px;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div id="loading" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <div>Carregando o TaskFlow…</div>
    <div class="bar"></div>
  </div>
  <noscript>O TaskFlow precisa do JavaScript ativado no navegador.</noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
